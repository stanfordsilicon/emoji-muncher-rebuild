<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Munchers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="crt-overlay" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<button id="backToLaunchpadBtn" class="back-to-launchpad" type="button" title="Return to launch pad">
  ← <span data-i18n="back_to_launchpad">RETURN TO LAUNCH PAD</span>
</button>
<button id="muteBtn" class="sound-toggle icon-btn" type="button" title="Mute sound" aria-label="Mute sound">🔊</button>

<div class="loading-screen" id="loadingScreen" aria-hidden="true">
  <p class="loading-text"><span data-i18n="loading">LOADING</span><span class="loading-dots">...</span></p>
  <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
</div>

<!-- ============ LOBBY SCREEN ============ -->
<section id="screen-lobby" class="screen">
  <div class="panel">
    <h1 data-i18n="app_title">😋 Emoji Munchers</h1>
    <p class="tag" data-i18n="app_tagline">Munch every emoji that matches the keyword. The rest cost a life.</p>

    <label class="field">
      <span data-i18n="username_label">Username</span>
      <input id="username" maxlength="20" data-i18n-placeholder="username_placeholder" placeholder="e.g. sid" autocomplete="off">
    </label>

    <button id="playSoloBtn" class="btn primary" data-i18n="play_button">Play</button>

    <p id="lobbyError" class="error"></p>
  </div>
</section>

<!-- ============ GAME SCREEN ============ -->
<section id="screen-game" class="screen hidden">
  <div id="game">
    <div id="topBar">
      <button id="homeBtnGame" class="icon-btn" title="Leave to home" aria-label="Leave to home">🏠</button>
      <div id="roundInfo">Round 1/8</div>
    </div>
    <div id="keywordBanner">
      <b id="keywordName">...</b>
    </div>
    <div id="roundOneBanner" class="round-one-banner hidden" data-i18n="round_one_banner">
      Eat emojis that match the keyword — the rest cost a life. Race to the 🚩!
    </div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="nextRoundNote" class="next-round-note hidden"></div>
    <div id="boardWrap">
      <div id="board"></div>
    </div>
    <div id="myStats">
      <span id="myScore" class="stat-chip"><span class="stat-icon">🏆</span><span id="myScoreVal">0</span></span>
      <span id="myLives" class="stat-chip"></span>
    </div>
    <div id="hint" data-i18n="persistent_hint">Arrow keys to move. Race to the 🚩!</div>
    <div id="touchpad">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
  </div>
</section>

<!-- ============ GAME OVER SCREEN ============ -->
<section id="screen-over" class="screen hidden">
  <div class="panel">
    <h2 data-i18n="game_over_title">Game Over</h2>
    <p class="final-score" id="finalScore"></p>
    <h3 data-i18n="all_time_leaderboard_heading">All-time leaderboard</h3>
    <ul id="leaderboardList" class="player-list small"></ul>
    <button id="playAgainBtn" class="btn primary" data-i18n="play_again_button">Play Again</button>
    <button id="homeBtnOver" class="btn" data-i18n="home_button">🏠 Home</button>
  </div>
</section>

<script src="i18n.js"></script>
<script src="sfx.js"></script>
<script src="arcade-client.js"></script>
<script src="client.js"></script>
</body>
</html>
